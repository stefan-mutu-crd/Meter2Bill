<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <p:menubar hideDelay="1000">
        <f:facet name="start">
            <p:graphicImage name="images/logo.png" height="25px"/>
        </f:facet>
        <p:submenu label="Users" icon="pi pi-fw pi-user">
            <p:menuitem value="Employee" icon="pi pi-users" outcome="/user/admin-users"/>
            <p:menuitem value="Customer" icon="pi pi-users" outcome="/user/customer-users"/>
        </p:submenu>
        <p:submenu label="Contracts" icon="pi pi-fw pi-briefcase">
            <p:menuitem value="Contracts" icon="pi pi-file-edit" outcome="/contract/contracts"/>
            <p:menuitem value="Contractors" icon="pi pi-building" outcome="/contract/contractors"/>
            <p:menuitem value="Contract templates" icon="pi pi-file" outcome="/contract/contract-templates"/>
            <p:menuitem value="Utilities" icon="pi pi-bolt" outcome="/utility/utilities"/>
        </p:submenu>
        <p:menuitem value="Units" icon="pi pi-fw pi-home" outcome="/unit/units"/>
    </p:menubar>

</ui:composition>
