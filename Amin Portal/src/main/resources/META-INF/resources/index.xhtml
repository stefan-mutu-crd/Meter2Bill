<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>JSF test</title>
</h:head>
<h:body>
    <h:form>
        <p:panel header="Hello PrimeFaces">
            <p:inputText value="#{helloBean.name}" placeholder="Your name"/>
            <p:commandButton value="Greet" action="#{helloBean.greet}" update="@form"/>
            <p:messages/>
        </p:panel>
    </h:form>
</h:body>
</html>
