spring.application.name=meter_to_bill
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meter_to_bill}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.springframework.security=DEBUG

joinfaces.faces.project-stage=development
joinfaces.faces.facelets-refresh-period=0
joinfaces.primefaces.theme=arya

server.servlet.context-parameters.jakarta.faces.AUTOMATIC_EXTENSIONLESS_MAPPING=true

