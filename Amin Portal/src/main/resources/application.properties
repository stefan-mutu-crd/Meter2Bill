spring.application.name=meter_to_bill
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meter_to_bill}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# If the listener throws (invalid JSON, MongoDB down), the message is rejected and dropped instead of requeued.
# Without this RabbitMQ redelivers the same failing message forever (poison message loop). Replace with a DLQ later.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DB:meter_to_bill}
spring.mongodb.username=${MONGO_USER:root}
spring.mongodb.password=${MONGO_PASSWORD:admin}
spring.mongodb.authentication-database=${MONGO_AUTH_DB:admin}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.springframework.security=DEBUG

joinfaces.faces.project-stage=development
joinfaces.faces.facelets-refresh-period=0
joinfaces.primefaces.theme=arya

server.servlet.context-parameters.jakarta.faces.AUTOMATIC_EXTENSIONLESS_MAPPING=true

