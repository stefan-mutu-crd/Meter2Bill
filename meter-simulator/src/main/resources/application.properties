spring.application.name=meter_simulator
spring.main.web-application-type=none
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meter_to_bill}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

simulator.start-date=
simulator.end-date=
simulator.speed-factor=3600
simulator.tick=1s
simulator.reading-interval=1h
simulator.seed=42
simulator.zone=Europe/Chisinau
simulator.queue=meter.readings
